name: Deploy to VDS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script: |
            powershell -ExecutionPolicy Bypass -Command "
              `$env:GH_DEPLOY_TOKEN='${{ secrets.GH_DEPLOY_TOKEN }}'
              & 'C:\AI-Working-Seacrh\scripts\deploy-zero-downtime.ps1' 2>&1 | Out-Host
              exit `$LASTEXITCODE
            "

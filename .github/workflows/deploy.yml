name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script: |
            powershell -Command "
              Write-Host '========================================'
              Write-Host '  DEPLOY STARTED'
              Write-Host '========================================'

              Set-Location 'C:\apps\AI-Working-Seacrh'

              Write-Host ''
              Write-Host '[1/6] Stopping service...'
              & 'C:\nssm-2.24\win64\nssm.exe' stop jobai-frontend 2>$null
              Start-Sleep -Seconds 3
              Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2

              Write-Host ''
              Write-Host '[2/6] Syncing code from GitHub...'
              git remote set-url origin 'https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/RaijiTRW/AI-Working-Seacrh.git'
              git fetch origin main
              git reset --hard origin/main
              git remote set-url origin 'https://github.com/RaijiTRW/AI-Working-Seacrh.git'

              Write-Host ''
              Write-Host '[3/6] Writing version...'
              git rev-parse --short HEAD | Out-File -FilePath '.version' -Encoding ascii -NoNewline
              Get-Content '.version'

              Write-Host ''
              Write-Host '[4/6] Installing dependencies...'
              npm ci

              Write-Host ''
              Write-Host '[5/6] Building...'
              npm run build

              Write-Host ''
              Write-Host '[6/6] Starting service...'
              & 'C:\nssm-2.24\win64\nssm.exe' start jobai-frontend
              Start-Sleep -Seconds 10

              Write-Host ''
              Write-Host 'Health check:'
              Invoke-WebRequest -Uri 'http://127.0.0.1:3000/api/version' -UseBasicParsing | Select-Object -ExpandProperty Content

              Write-Host ''
              Write-Host '========================================'
              Write-Host '  DEPLOY COMPLETE'
              Write-Host '========================================'
            "

name: Auto Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd C:\apps\AI-Working-Seacrh

            echo ========================================
            echo   DEPLOY STARTED
            echo ========================================

            echo [1/6] Saving old version...
            git rev-parse --short HEAD > .version-old
            type .version-old

            echo [2/6] Pulling latest code...
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD > .version
            type .version

            echo [3/6] Installing dependencies...
            call npm ci --prefer-offline --no-audit || exit /b 1

            echo [4/6] Building frontend...
            if exist .next rmdir /s /q .next
            if exist node_modules\.cache rmdir /s /q node_modules\.cache
            call npm run build || exit /b 1
            if not exist .next exit /b 1
            echo Build OK!

            echo [5/6] Restarting frontend...
            C:\nssm-2.24\win64\nssm.exe stop jobai-frontend
            timeout /t 3 /nobreak
            for /f "tokens=5" %%a in ('netstat -ano ^| findstr ":3000.*LISTENING"') do taskkill /F /PID %%a
            timeout /t 2 /nobreak
            C:\nssm-2.24\win64\nssm.exe start jobai-frontend
            timeout /t 10 /nobreak

            echo [6/6] Health check (10 attempts)...
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            timeout /t 3 /nobreak
            curl -s -f http://127.0.0.1:3000/api/version && goto :deploy_ok
            echo HEALTH CHECK FAILED!
            C:\nssm-2.24\win64\nssm.exe status jobai-frontend
            exit /b 1

            :deploy_ok
            echo ========================================
            echo   DEPLOY SUCCESSFUL!
            echo ========================================
            echo Old version:
            type .version-old
            echo New version:
            type .version
            echo ========================================

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy successful: ${{ steps.vars.outputs.sha_short }}"
          else
            echo "❌ Deploy FAILED"
          fi

name: Deploy to VDS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $token='${{ secrets.GH_DEPLOY_TOKEN }}'; if ([string]::IsNullOrWhiteSpace($token)) { throw 'GH_DEPLOY_TOKEN is empty' }; if (Test-Path 'C:\AI-Working-Seacrh\.git') { $repoDir='C:\AI-Working-Seacrh' } elseif (Test-Path 'C:\apps\AI-Working-Seacrh\.git') { $repoDir='C:\apps\AI-Working-Seacrh' } else { throw 'Repository not found in C:\AI-Working-Seacrh or C:\apps\AI-Working-Seacrh' }; Write-Host ('Repo dir: ' + $repoDir); & git -C $repoDir config --local credential.helper ''; & git -C $repoDir remote set-url origin ('https://' + $token + '@github.com/RaijiTRW/AI-Working-Seacrh.git'); & git -C $repoDir fetch origin main; if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }; & git -C $repoDir reset --hard origin/main; if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }; & git -C $repoDir clean -fd; $deployScript = Join-Path $repoDir 'scripts\deploy.ps1'; if (-not (Test-Path $deployScript)) { throw ('deploy.ps1 not found at ' + $deployScript) }; $env:GH_DEPLOY_TOKEN = $token; Write-Host ('Using deploy script: ' + $deployScript); & $deployScript; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"

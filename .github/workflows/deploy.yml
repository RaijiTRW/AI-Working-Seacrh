name: Deploy to VDS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $env:GH_DEPLOY_TOKEN='${{ secrets.GH_DEPLOY_TOKEN }}'; if ([string]::IsNullOrWhiteSpace($env:GH_DEPLOY_TOKEN)) { throw 'GH_DEPLOY_TOKEN is empty' }; if (Test-Path 'C:\AI-Working-Seacrh\scripts\deploy.ps1') { $deployScript='C:\AI-Working-Seacrh\scripts\deploy.ps1' } elseif (Test-Path 'C:\apps\AI-Working-Seacrh\scripts\deploy.ps1') { $deployScript='C:\apps\AI-Working-Seacrh\scripts\deploy.ps1' } else { throw 'deploy.ps1 not found in C:\AI-Working-Seacrh or C:\apps\AI-Working-Seacrh' }; Write-Host ('Using deploy script: ' + $deployScript); & $deployScript; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"

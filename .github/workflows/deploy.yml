name: Auto Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd C:\apps\AI-Working-Seacrh

            echo === Saving version ===
            git rev-parse --short HEAD > .version-old

            echo === Git pull ===
            git fetch origin main
            git reset --hard origin/main

            echo === Installing dependencies ===
            call npm ci --prefer-offline --no-audit

            echo === Backend dependencies ===
            cd backend
            pip install -r requirements.txt --quiet
            cd ..

            echo === Clearing all caches ===
            if exist .next rmdir /s /q .next
            if exist node_modules\.cache rmdir /s /q node_modules\.cache

            echo === Building frontend ===
            call npm run build

            echo === Updating version file ===
            git rev-parse --short HEAD > .version

            echo === Restarting services via scheduled task ===
            schtasks /run /tn "JobAI-Restart"
            timeout /t 15 /nobreak

            echo === Health check ===
            curl -s http://127.0.0.1:3000/api/version || echo Frontend not responding yet
            curl -s http://127.0.0.1:8001/health || echo Backend not responding yet

            echo === Done ===

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy successful: ${{ steps.vars.outputs.sha_short }}"
          else
            echo "❌ Deploy FAILED"
          fi

name: Auto Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd C:\apps\AI-Working-Seacrh

            echo === Saving current version ===
            git rev-parse --short HEAD > .version-old 2>nul || echo unknown > .version-old

            echo === Git pull ===
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD > .version

            echo === Installing dependencies ===
            call npm ci --prefer-offline --no-audit

            echo === Backend dependencies ===
            cd backend
            pip install -r requirements.txt --quiet --disable-pip-version-check
            cd ..

            echo === Building Next.js ===
            if exist .next rmdir /s /q .next
            call npm run build

            echo === Reloading PM2 ===
            call npx pm2 reload all --update-env || call npx pm2 start ecosystem.config.js
            call npx pm2 save

            echo === PM2 Status ===
            call npx pm2 status

            echo === Deployment complete ===

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy successful: ${{ steps.vars.outputs.sha_short }}"
            echo "   Commit: ${{ steps.vars.outputs.commit_msg }}"
          else
            echo "❌ Deploy FAILED: ${{ steps.vars.outputs.sha_short }}"
          fi

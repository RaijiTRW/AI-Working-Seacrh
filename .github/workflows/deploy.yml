name: Auto Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            echo "=== Deployment started ==="
            cd /c/apps/AI-Working-Seacrh

            # Сохраняем старую версию
            cat .version 2>/dev/null > .version-old || echo "unknown" > .version-old

            echo "=== Git pull ==="
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD > .version

            echo "=== Cleaning cache ==="
            rm -rf .next
            rm -rf node_modules/.cache

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Backend dependencies ==="
            cd backend
            pip install -r requirements.txt --quiet
            cd ..

            echo "=== Building Next.js ==="
            npm run build

            echo "=== Stopping old services ==="
            # Убиваем все node и python процессы на наших портах
            taskkill //F //IM node.exe 2>/dev/null || true
            sleep 2

            echo "=== Starting Frontend ==="
            cd /c/apps/AI-Working-Seacrh
            nohup npm run start > logs/frontend-out.log 2> logs/frontend-error.log &
            sleep 5

            echo "=== Starting Backend ==="
            cd /c/apps/AI-Working-Seacrh/backend
            nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > ../logs/backend-out.log 2> ../logs/backend-error.log &
            sleep 5

            echo "=== Health check ==="
            cd /c/apps/AI-Working-Seacrh

            # Frontend
            for i in 1 2 3 4 5; do
              if curl -s http://127.0.0.1:3000/api/version | grep -q "version"; then
                echo "✓ Frontend OK"
                break
              fi
              echo "Waiting for frontend... ($i)"
              sleep 3
            done

            # Backend
            for i in 1 2 3 4 5; do
              if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
                echo "✓ Backend OK"
                break
              fi
              echo "Waiting for backend... ($i)"
              sleep 3
            done

            echo "=== Deployment complete ==="
            echo "Old: $(cat .version-old)"
            echo "New: $(cat .version)"

      - name: Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy OK: ${{ steps.vars.outputs.sha_short }}"
          else
            echo "❌ Deploy FAILED"
          fi

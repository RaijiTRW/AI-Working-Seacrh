name: Auto Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 20m
          script: |
            echo "=== Deployment started ==="
            cd /c/apps/AI-Working-Seacrh

            cat .version > .version-old 2>/dev/null || echo "unknown" > .version-old

            echo "=== Git pull ==="
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD > .version

            echo "=== Cleaning cache ==="
            rm -rf .next
            rm -rf node_modules/.cache

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Backend dependencies ==="
            cd backend
            pip install -r requirements.txt --quiet
            cd ..

            echo "=== Building Next.js ==="
            npm run build

            echo "=== PM2 services ==="
            # Check if PM2 processes exist, if not - start them
            if pm2 list | grep -q "jobai-frontend"; then
              echo "Reloading existing PM2 processes..."
              pm2 reload all --update-env
            else
              echo "Starting PM2 processes for the first time..."
              pm2 start ecosystem.config.js
              pm2 save
            fi

            echo "=== PM2 Status ==="
            pm2 status

            sleep 5

            echo "=== Health check ==="
            curl -s http://127.0.0.1:3000/api/version && echo " Frontend OK" || echo "Frontend not ready"
            curl -s http://127.0.0.1:8000/health && echo " Backend OK" || echo "Backend not ready"

            echo "=== Deployment complete ==="
            echo "Old: $(cat .version-old)"
            echo "New: $(cat .version)"

      - name: Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy OK: ${{ steps.vars.outputs.sha_short }}"
          else
            echo "❌ Deploy FAILED"
          fi

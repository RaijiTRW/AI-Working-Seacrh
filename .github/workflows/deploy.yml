name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script: |
            cd C:\apps\AI-Working-Seacrh
            C:\nssm-2.24\win64\nssm.exe stop jobai-frontend
            timeout /t 5 /nobreak
            taskkill /F /IM node.exe
            timeout /t 3 /nobreak
            git config --global credential.helper store
            echo https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com > %USERPROFILE%\.git-credentials
            git fetch origin main
            git reset --hard origin/main
            del %USERPROFILE%\.git-credentials
            git rev-parse --short HEAD > .version
            type .version
            npm ci
            npm run build
            C:\nssm-2.24\win64\nssm.exe start jobai-frontend
            timeout /t 10 /nobreak
            curl http://127.0.0.1:3000/api/version

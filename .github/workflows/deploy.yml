name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get commit info
        id: version
        run: |
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script: |
            echo ========================================
            echo   DEPLOY STARTED
            echo ========================================

            cd /d C:\apps\AI-Working-Seacrh

            echo.
            echo [1/6] Stopping service...
            C:\nssm-2.24\win64\nssm.exe stop jobai-frontend 2>nul
            ping -n 3 127.0.0.1 >nul
            taskkill /F /IM node.exe 2>nul
            ping -n 2 127.0.0.1 >nul

            echo.
            echo [2/6] Syncing code from GitHub...
            git remote set-url origin https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/RaijiTRW/AI-Working-Seacrh.git
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin https://github.com/RaijiTRW/AI-Working-Seacrh.git

            echo.
            echo [3/6] Writing version...
            git rev-parse --short HEAD > .version
            type .version

            echo.
            echo [4/6] Installing dependencies...
            call npm ci

            echo.
            echo [5/6] Building...
            call npm run build

            echo.
            echo [6/6] Starting service...
            C:\nssm-2.24\win64\nssm.exe start jobai-frontend
            ping -n 10 127.0.0.1 >nul

            echo.
            echo Health check:
            curl -s http://127.0.0.1:3000/api/version

            echo.
            echo ========================================
            echo   DEPLOY COMPLETE
            echo ========================================

name: Auto Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 30m
          script: |
            echo "=== DEPLOY START ==="
            echo "Target commit: ${{ steps.vars.outputs.sha_short }}"
            cd C:\apps\AI-Working-Seacrh
            echo "Current dir: %CD%"
            echo "Current HEAD:"
            git rev-parse --short HEAD
            echo "Fetching..."
            git fetch --all --prune
            echo "Remote origin/main:"
            git rev-parse --short origin/main
            echo "Resetting to origin/main..."
            git reset --hard origin/main
            echo "New HEAD:"
            git rev-parse --short HEAD
            echo "Running PowerShell deploy script..."
            powershell -ExecutionPolicy Bypass -File scripts\deploy-remote.ps1
            echo "=== DEPLOY END ==="

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy successful: ${{ steps.vars.outputs.sha_short }}"
          else
            echo "❌ Deploy FAILED"
          fi

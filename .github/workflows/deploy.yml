name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          command_timeout: 30m
          script: |
            cmd /c "cd /d C:\apps\AI-Working-Seacrh & echo === STOP === & C:\nssm-2.24\win64\nssm.exe stop jobai-frontend & timeout /t 5 /nobreak & taskkill /F /IM node.exe & timeout /t 5 /nobreak & taskkill /F /IM node.exe & timeout /t 5 /nobreak & echo === CLEAN === & rmdir /s /q node_modules & timeout /t 3 /nobreak & echo === FETCH === & git remote set-url origin https://${{ secrets.GH_DEPLOY_TOKEN }}@github.com/RaijiTRW/AI-Working-Seacrh.git & git fetch origin main & git reset --hard origin/main & git remote set-url origin https://github.com/RaijiTRW/AI-Working-Seacrh.git & echo === VERSION === & git rev-parse --short HEAD & git rev-parse --short HEAD > .version & type .version & echo === NPM === & npm ci & echo === BUILD === & npm run build & echo === START === & C:\nssm-2.24\win64\nssm.exe start jobai-frontend & timeout /t 8 /nobreak & echo === CHECK === & curl -s http://127.0.0.1:3000/api/version & echo === DONE ==="

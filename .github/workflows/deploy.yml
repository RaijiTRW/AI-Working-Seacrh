name: Auto Deploy to VDS

on:
  push:
    branches:
      - main  # Деплой при пуше в main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получаем всю историю для версионирования

      - name: Get commit SHA (short)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: 15m
          script: |
            echo "=== Starting deployment ==="
            cd /c/apps/AI-Working-Seacrh

            # Сохраняем текущий коммит для проверки версии
            git rev-parse --short HEAD > .version-old 2>/dev/null || echo "unknown" > .version-old

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            # Сохраняем новый коммит
            git rev-parse --short HEAD > .version

            echo "=== Installing Frontend dependencies ==="
            npm ci --production=false

            echo "=== Installing Backend dependencies ==="
            cd backend
            pip install -r requirements.txt --quiet
            cd ..

            echo "=== Building Next.js ==="
            export NODE_ENV=production
            npm run build

            echo "=== Restarting services with PM2 (zero-downtime) ==="
            # Проверяем, запущен ли PM2
            if pm2 list | grep -q "jobai"; then
              # PM2 reload для zero-downtime
              pm2 reload ecosystem.config.js --update-env
            else
              # Первый запуск
              pm2 start ecosystem.config.js
            fi

            # Сохраняем конфигурацию PM2
            pm2 save

            echo "=== Waiting for services to start ==="
            sleep 5

            echo "=== Health check ==="
            # Frontend check
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/version | grep -q "200"; then
              echo "✓ Frontend is healthy"
            else
              echo "⚠ Frontend health check failed, but continuing..."
            fi

            # Backend check
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health | grep -q "200"; then
              echo "✓ Backend is healthy"
            else
              echo "⚠ Backend health check failed, but continuing..."
            fi

            # PM2 status
            pm2 status

            echo "=== Deployment completed successfully ==="
            echo "Old version: $(cat .version-old)"
            echo "New version: $(cat .version)"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful! Version: ${{ steps.vars.outputs.sha_short }}"
          else
            echo "❌ Deployment failed!"
          fi

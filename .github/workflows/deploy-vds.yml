name: Deploy to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env*' --exclude='node_modules/' --exclude='.next/' --exclude='logs/'
          path: /
          remote_path: /var/www/jobaisearch
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Install dependencies and build on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            cd /var/www/jobaisearch

            echo "Installing dependencies..."
            npm ci

            echo "Building project..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart jobaisearch || pm2 start npm --name "jobaisearch" -- start

            echo "Deployment complete!"
            pm2 status

name: Deploy to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-jobaisearch-vds
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude='.env*'
            --exclude='node_modules/'
            --exclude='.next/'
            --exclude='logs/'
            --exclude='backend/JobAISeacrh_Backend/venv/'
            --exclude='.claude/'
            --exclude='.gemini/'
            --exclude='._*'
          path: ./
          remote_path: /var/www/jobaisearch/repo/
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Deploy on VDS (systemd)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script_stop: true
          script: |
            sudo /usr/local/bin/jobaisearch-deploy
            systemctl is-active jobaisearch-frontend jobaisearch-backend caddy
            curl -fsS -o /dev/null -w "frontend:%{http_code}\n" http://127.0.0.1:3000/
            curl -fsS -o /dev/null -w "backend:%{http_code}\n" http://127.0.0.1:8000/health
            curl -kfsS -o /dev/null -w "site:%{http_code}\n" https://jobaisearch.ru/
            curl -kfsS -o /dev/null -w "health:%{http_code}\n" https://jobaisearch.ru/health

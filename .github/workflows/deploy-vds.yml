name: Deploy to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-jobaisearch-vds
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate backend repo token
        env:
          BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_REPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret BACKEND_REPO_TOKEN"
            exit 1
          fi
          rm -rf backend/JobAISeacrh_Backend
          mkdir -p backend

      - name: Checkout backend repo (separate repository)
        uses: actions/checkout@v4
        with:
          repository: RaijiTRW/JobAISeacrh_Backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend/JobAISeacrh_Backend
          fetch-depth: 1

      - name: Validate backend checkout
        run: |
          set -euo pipefail
          rm -rf backend/JobAISeacrh_Backend/.git
          test -f backend/JobAISeacrh_Backend/requirements.txt
          test -f backend/JobAISeacrh_Backend/main.py

      - name: Deploy repo snapshot to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude='.git/'
            --exclude='.env*'
            --exclude='node_modules/'
            --exclude='.next/'
            --exclude='logs/'
            --exclude='backend/venv/'
            --exclude='backend/JobAISeacrh_Backend/venv/'
            --exclude='.claude/'
            --exclude='.gemini/'
            --exclude='._*'
          path: ./
          remote_path: /var/www/jobaisearch/repo/
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Zero-downtime deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail

            sudo /usr/local/bin/jobaisearch-deploy

            ACTIVE_SLOT="$(sudo cat /etc/jobaisearch/active_slot)"
            echo "active-slot:${ACTIVE_SLOT}"

            curl -kfsS -o /dev/null -w "site:%{http_code}\n" https://jobaisearch.ru/
            curl -kfsS -o /dev/null -w "health:%{http_code}\n" https://jobaisearch.ru/health

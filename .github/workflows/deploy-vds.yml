name: Deploy to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env*' --exclude='node_modules/' --exclude='.next/' --exclude='logs/'
          path: /
          remote_path: /var/www/jobaisearch
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /var/www/jobaisearch

            # Ensure logs directory exists
            mkdir -p logs

            echo "📦 Installing dependencies..."
            npm ci --prefer-offline --no-audit --no-fund

            echo "🔨 Building project..."
            NODE_ENV=production npm run build

            echo "📝 Ensuring startup script exists..."

            # Create startup script if it doesn't exist
            sudo mkdir -p /usr/local/bin
            sudo tee /usr/local/bin/start-services.sh > /dev/null <<'SCRIPT_EOF'
#!/bin/bash
cd /var/www/jobaisearch
echo "Starting frontend..."
nohup npm run start > /tmp/frontend.log 2>&1 &
echo "Starting backend..."
cd /var/www/jobaisearch/backend/JobAISeacrh_Backend
nohup venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
echo "Services started"
SCRIPT_EOF
            sudo chmod +x /usr/local/bin/start-services.sh

            echo "🔄 Restarting application..."

            # Check if service file exists
            if [ -f /etc/systemd/system/jobaisearch.service ]; then
              echo "✓ Service file exists"
            else
              echo "✗ Service file NOT found - creating it"
              sudo tee /etc/systemd/system/jobaisearch.service > /dev/null <<'SERVICE_EOF'
[Unit]
Description=JobAISearch Services
After=network.target caddy.service

[Service]
Type=simple
User=ubuntu
WorkingDirectory=/var/www/jobaisearch
ExecStart=/usr/local/bin/start-services.sh
Restart=on-failure
RestartSec=10
MemoryMax=2G
CPUQuota=50%

[Install]
WantedBy=multi-user.target
SERVICE_EOF
              sudo systemctl daemon-reload
              sudo systemctl enable jobaisearch.service
            fi

            # Kill any existing processes on ports 3000
            sudo fuser -k 3000/tcp 2>/dev/null || true
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sleep 2

            # Restart systemd service
            sudo systemctl restart jobaisearch.service

            echo "⏳ Waiting for app to be ready..."
            sleep 20

            echo "✅ Deployment complete!"
            sudo systemctl status jobaisearch.service --no-pager | head -20

            echo ""
            echo "🔍 Service logs (last 30 lines):"
            sudo journalctl -u jobaisearch.service -n 30 --no-pager

            # Health check
            echo ""
            echo "🔍 Health check:"
            curl -sf http://localhost:3000 > /dev/null && echo "✓ Frontend is responding" || echo "✗ Frontend is not responding"

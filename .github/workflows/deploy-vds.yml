name: Deploy to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env*' --exclude='node_modules/' --exclude='.next/' --exclude='logs/'
          path: /
          remote_path: /var/www/jobaisearch
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /var/www/jobaisearch

            # Ensure logs directory exists
            mkdir -p logs

            echo "📦 Installing dependencies..."
            npm ci --prefer-offline --no-audit --no-fund

            echo "🔨 Building project..."
            NODE_ENV=production npm run build

            echo "🛑 Stopping any existing processes..."
            pkill -f "node.*next" || true
            pkill -f "uvicorn" || true
            sleep 3

            echo "🚀 Starting services directly..."
            # Start backend
            cd /var/www/jobaisearch/backend/JobAISeacrh_Backend
            nohup venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
            echo $! > /tmp/backend.pid

            # Start frontend
            cd /var/www/jobaisearch
            nohup npm run start > /tmp/frontend.log 2>&1 &
            echo $! > /tmp/frontend.pid

            echo "⏳ Waiting for services to start..."
            sleep 20

            echo "✅ Deployment complete!"

            echo ""
            echo "🔍 Process status:"
            ps aux | grep -E "(next|uvicorn)" | grep -v grep || echo "No processes found"

            echo ""
            echo "📋 Frontend log (last 10 lines):"
            tail -10 /tmp/frontend.log || echo "No frontend log"

            echo ""
            echo "📋 Backend log (last 10 lines):"
            tail -10 /tmp/backend.log || echo "No backend log"

            # Health check
            echo ""
            echo "🔍 Health check:"
            curl -sf http://localhost:3000 > /dev/null && echo "✓ Frontend is responding" || echo "✗ Frontend is not responding"
            curl -sf http://localhost:8000/health && echo "✓ Backend is healthy" || echo "✗ Backend health check failed"
